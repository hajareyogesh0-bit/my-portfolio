<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yogesh DevOps Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      text-align: center;
    }

    .container {
      padding: 80px 20px;
    }

    h1 {
      font-size: 50px;
      margin-bottom: 10px;
      animation: fadeIn 2s ease-in-out;
    }

    h2 {
      font-weight: 300;
      color: #00d4ff;
      margin-bottom: 30px;
    }

    p {
      font-size: 18px;
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }

    .btn {
      margin-top: 30px;
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      background: #00d4ff;
      color: black;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
      transform: scale(1.05);
    }

    footer {
      margin-top: 80px;
      font-size: 14px;
      color: #ccc;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🚀 Hello Yogesh</h1>
    <h2>DevOps Engineer in Progress</h2>

    <p>
      This website is hosted on AWS EC2 using CloudFormation.
      Built with real DevOps skills including Infrastructure as Code,
      SSH, and Nginx setup.
    </p>

    <button class="btn">My First Live Server 🌐</button>

    <footer>
      <p>Powered by AWS | Built by Yogesh 💻</p>
    </footer>
  </div>

</body>
</html>
